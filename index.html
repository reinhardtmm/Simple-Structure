<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Tulangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --paper:#f3f0e8; --paper2:#ebe7dc; --card:#fbfaf6; --ink:#1c1e21; --ink2:#4a4f57; --ink3:#7d838c;
  --line:#d6d1c4; --line2:#c3bdae;
  --srpmk:#b4321f; --srpmb:#1f5fa8; --acc:var(--srpmk);
  --ok:#2f7d4a; --bad:#b4321f; --info:#6b7280;
  --long:#9a3412; --conf:#0f766e; --mid:#4f6d8a; --lap:#b7791f; --tie:#6d28d9;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
}
body.sys-SRPMB{--acc:var(--srpmb)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.45;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on[data-sys=SRPMK]{background:var(--srpmk);color:#fff}
.seg button.on[data-sys=SRPMB]{background:var(--srpmb);color:#fff}
.syslabel{font-size:12px;color:var(--ink3);max-width:260px}
main{--navW:210px;--sideW:400px;display:grid;grid-template-columns:var(--navW) 1fr var(--sideW);min-height:0;transition:grid-template-columns .22s ease}
nav{border-right:1px solid var(--line);padding:14px 10px;overflow:auto;background:var(--paper)}
nav,aside{min-width:0;transition:opacity .15s ease}
body.hide-nav main{--navW:0px}
body.hide-side main{--sideW:0px}
body.hide-nav nav,body.hide-side aside{visibility:hidden;opacity:0;overflow:hidden;border:0;padding-left:0;padding-right:0}
.pt{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;border:1px solid var(--line2);border-radius:7px;background:var(--card);color:var(--ink2);cursor:pointer;padding:0}
.pt:hover{color:var(--ink);border-color:var(--ink3)}
.pt:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.pt svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.pt .bar{fill:currentColor;stroke:none;transition:opacity .15s}
.pt[aria-expanded=false] .bar{opacity:.2}
@media (prefers-reduced-motion: reduce){ main,nav,aside{transition:none} }
nav h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:6px 8px 8px;font-weight:500}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--ink);font-size:14px}
nav button:hover:not(:disabled):not(.on){background:var(--paper2)}
nav button.on{background:var(--ink);color:var(--paper)}
nav button:disabled{color:var(--ink3);cursor:default}
nav button small{font-family:var(--mono);font-size:10px;color:var(--ink3)}
nav .note{font-size:11.5px;color:var(--ink3);margin:16px 8px 0;line-height:1.5}
#view{position:relative;min-width:0;min-height:0;background:var(--paper)}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font-family:var(--mono);font-size:11px;background:rgba(251,250,246,.92);border:1px solid var(--line2);padding:2px 6px;border-radius:4px;white-space:nowrap;color:var(--ink)}
.lbl.conf{border-color:var(--conf);color:var(--conf)}
.lbl.lap{border-color:var(--lap);color:#8a5a12}
.lbl.mid{border-color:var(--mid);color:var(--mid)}
.lbl.dim{background:transparent;border:0;color:var(--ink2)}
.toolbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:rgba(251,250,246,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(4px)}
.toolbar label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.toolbar input[type=range]{width:110px;accent-color:var(--acc)}
.toolbar input[type=checkbox]{accent-color:var(--acc)}
.toolbar .btn{border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.legend{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px;background:rgba(251,250,246,.9);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:7px;vertical-align:middle}
.hint{position:absolute;top:12px;right:12px;font-size:11.5px;color:var(--ink3);background:rgba(251,250,246,.85);padding:4px 8px;border-radius:6px}
#card{position:absolute;top:44px;right:12px;width:290px;background:var(--card);border:1px solid var(--line2);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px 12px;box-shadow:0 6px 24px rgba(0,0,0,.08);display:none}
#card.show{display:block}
#card h5{margin:0 0 4px;font-size:14px}
#card p{margin:4px 0;font-size:12.5px;color:var(--ink2)}
#card .pasal{font-family:var(--mono);font-size:11px;color:var(--acc)}
#card .x{position:absolute;top:6px;right:8px;border:0;background:none;cursor:pointer;font-size:16px;color:var(--ink3)}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--card)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:11px 4px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.tabs .badge{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:9px;margin-left:4px;background:var(--paper2)}
.tabs .badge.bad{background:var(--bad);color:#fff}
.tabs .badge.good{background:var(--ok);color:#fff}
.pane{flex:1;overflow:auto;padding:14px 16px 28px;display:none}
.pane.on{display:block}
.grp{margin-bottom:16px}
.grp h6{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px;font-weight:500}
.row{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:8px;margin:5px 0}
.row label{font-size:13px;color:var(--ink2)}
.row label small{color:var(--ink3);font-family:var(--mono);font-size:10.5px;display:block}
.row input[type=number],.row select{width:100%;padding:5px 8px;border:1px solid var(--line2);border-radius:6px;background:#fff;font-family:var(--mono);font-size:13px;text-align:right}
.row select{text-align:left}
.row input:focus,.row select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.derived{font-family:var(--mono);font-size:12px;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.7}
.derived b{color:var(--ink);font-weight:600}
.btn2{border:1px solid var(--line2);background:var(--paper);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12.5px}
.sum{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:12px;font-weight:600}
.sum.good{background:#e6f1ea;color:var(--ok)}
.sum.bad{background:#f6e3df;color:var(--bad)}
.chk{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:9px 0;border-bottom:1px dashed var(--line)}
.chk .ic{font-family:var(--mono);font-weight:700;font-size:13px;line-height:1.4}
.chk.ok .ic{color:var(--ok)} .chk.bad .ic{color:var(--bad)} .chk.info .ic{color:var(--info)}
.chk .t{font-size:13px;font-weight:500}
.chk .d{font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-top:2px}
.chk .p{font-family:var(--mono);font-size:10.5px;color:var(--acc);margin-top:2px}
.chk.bad .t{color:var(--bad)}
.disclaimer{font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line);margin-top:14px;padding-top:10px;line-height:1.55}
.draw{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:12px}
.draw h6{margin:2px 4px 6px}
.draw svg{display:block;width:100%;height:auto}
.draw.tall svg{max-height:560px}
.prose h3{font-size:15px;margin:2px 0 6px}
.prose h4{font-size:13.5px;margin:16px 0 4px}
.prose p,.prose li{font-size:13.5px;color:var(--ink2)}
.prose ul{padding-left:18px;margin:6px 0}
.prose li{margin:4px 0}
.prose .pasal{font-family:var(--mono);font-size:11px;color:var(--acc);white-space:nowrap}
.prose .box{background:var(--paper);border-left:3px solid var(--acc);padding:8px 10px;border-radius:0 6px 6px 0;margin:10px 0;font-size:13px;color:var(--ink2)}
@media (max-width: 980px){
  body{overflow:auto;display:block}
  header{flex-wrap:wrap;gap:8px 10px;padding:10px 12px}
  .syslabel,.spacer{display:none}
  .brand{flex:1;min-width:0}
  .brand b{white-space:nowrap}
  #tglSide{order:2}
  #sysSeg{order:3;flex-basis:100%;display:flex}
  #sysSeg button{flex:1}
  main{display:flex;flex-direction:column}
  nav{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px}
  nav h4,nav .note{display:none}
  nav button{width:auto;white-space:nowrap;gap:6px}
  #view{height:62vh;min-height:380px}
  body.hide-nav nav,body.hide-side aside{display:none}
  body.hide-nav.hide-side #view{height:calc(100vh - 110px)}
  aside{border-left:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  #card{width:auto;left:12px}
  .legend{display:none}
  .toolbar input[type=range]{width:80px}
}

body.sys-NA{--acc:#4a4f57}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg button:disabled.on{background:transparent;color:var(--ink2)}
.legend{pointer-events:auto;max-width:250px}
.legend .lh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.legend .lh b{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.legend .lh button{border:0;background:none;color:var(--acc);font-size:11px;cursor:pointer;padding:0 0 0 6px}
.legend label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font-size:12px}
.legend label input{margin:0;accent-color:var(--acc)}
.legend label i{margin-right:0}
.legend .cn{font-size:11px;color:var(--ink3);border-top:1px dashed var(--line);margin-top:4px;padding-top:4px;line-height:1.45}
.draw h6{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:2px 4px 2px;font-weight:600}
.draw .sub{font-family:var(--mono);font-size:11px;color:var(--ink3);margin:0 4px 6px}
.draw2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.draw2 .draw{margin-bottom:12px}
.row .cb{justify-self:end;width:18px;height:18px;accent-color:var(--acc)}
@media (max-width:980px){ .legend{display:flex;top:auto;bottom:118px;left:8px;max-height:45%;overflow:auto;font-size:11px} .legend:not(.open) label,.legend:not(.open) .cn,.legend:not(.open) .lh span{display:none} .legend .lh b::after{content:' ▴'} .legend:not(.open) .lh b::after{content:' ▾'} .legend .lh b{cursor:pointer} .draw2{grid-template-columns:1fr} .hint{display:none} }
</style>
</head>
<body class="sys-SRPMK">
<header>
  <button class="pt" id="tglNav" aria-controls="nav" aria-expanded="true" title="Sembunyikan daftar komponen ( [ )" aria-label="Sembunyikan daftar komponen"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><rect class="bar" x="4" y="5" width="4" height="10" rx=".8"/></svg></button>
  <div class="brand"><b>Atlas Tulangan</b><span id="crumb"></span></div>
  <div class="spacer"></div>
  <span class="syslabel" id="syslabel"></span>
  <div class="seg" id="sysSeg">
    <button data-sys="SRPMB">SRPMB</button>
    <button data-sys="SRPMK" class="on">SRPMK</button>
  </div>
  <button class="pt" id="tglSide" aria-controls="side" aria-expanded="true" title="Sembunyikan panel konfigurasi ( ] )" aria-label="Sembunyikan panel konfigurasi"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><rect class="bar" x="12" y="5" width="4" height="10" rx=".8"/></svg></button>
</header>
<main>
  <nav id="nav"></nav>
  <section id="view">
    <div id="labels"></div>
    <div class="legend" id="legend"></div>
    <div class="hint">Seret untuk memutar, scroll untuk zoom, klik tulangan untuk detail</div>
    <div id="card"><button class="x" id="cardX" aria-label="Tutup">×</button><h5 id="cardT"></h5><div id="cardB"></div></div>
    <div class="toolbar">
      <label>Transparansi beton <input type="range" id="xray" min="0" max="1" step="0.01" value="0.72"></label>
      <label>Potong <input type="range" id="cut" min="0" max="1" step="0.005" value="1"></label>
      <label>Urai <input type="range" id="explode" min="0" max="1" step="0.01" value="0"></label>
      <label><input type="checkbox" id="labelsOn" checked> Label</label>
      <button class="btn" id="resetCam">Reset kamera</button>
    </div>
  </section>
  <aside id="side">
    <div class="tabs" id="tabs">
      <button data-tab="param" class="on">Parameter</button>
      <button data-tab="cek">Cek SNI <span class="badge" id="badge">0</span></button>
      <button data-tab="gambar">Gambar</button>
      <button data-tab="teori">Penjelasan</button>
    </div>
    <div class="pane on" id="pane-param"></div>
    <div class="pane" id="pane-cek"></div>
    <div class="pane" id="pane-gambar"></div>
    <div class="pane prose" id="pane-teori"></div>
  </aside>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
